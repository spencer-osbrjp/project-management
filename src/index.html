<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>project-management</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header id="topbar">
      <span id="repo-name" class="muted">No repository connected</span>
      <span id="repo-branch" class="badge" hidden></span>
      <span class="spacer"></span>
      <select id="account-select" hidden aria-label="GitHub account" data-tip="GitHub account"></select>
      <button id="fetch-btn" data-icon="fetch" data-tip="Fetch all remotes" hidden>Fetch</button>
      <button id="pull-btn" data-icon="pull" data-tip="Pull from origin" hidden>Pull</button>
      <button id="push-btn" data-icon="push" data-tip="Push to origin" hidden>Push</button>
    </header>

    <div id="shell">
      <aside id="sidebar">
        <div class="side-head">
          Repositories
          <span class="side-actions">
            <button id="rescan-btn" title="Rescan folders" aria-label="Rescan folders">↻</button>
            <button id="add-dir-btn" title="Add a repos folder" aria-label="Add a repos folder">+</button>
          </span>
        </div>
        <div id="repo-groups"></div>
      </aside>

      <div id="content">
        <nav id="tabs">
          <button class="tab active" data-tab="dash">Dashboard</button>
          <button class="tab" data-tab="cal">Calendar</button>
          <button class="tab" data-tab="changes">Changes</button>
          <button class="tab" data-tab="history">History</button>
          <button class="tab" data-tab="prs">Pull Requests</button>
          <button class="tab" data-tab="notes">Notes</button>
        </nav>

        <main>
          <section id="tab-dash" class="tab-panel">
            <div class="board-toolbar">
              <button id="new-ticket-btn" data-icon="plus" data-tip="Create a ticket (and a GitHub issue)">New ticket</button>
              <button id="sync-btn" data-icon="sync" data-tip="Import open GitHub issues as tickets" hidden>Sync issues</button>
              <span class="spacer"></span>
              <input id="filter-text" type="search" placeholder="Search title or description…" aria-label="Search tickets" />
            </div>
            <div class="filters">
              <select id="filter-status" aria-label="Filter by deadline" data-tip="Deadline">
                <option value="">All open</option>
                <option value="overdue">Overdue</option>
                <option value="soon">Due in 24h</option>
                <option value="dated">Has deadline</option>
                <option value="none">No deadline</option>
              </select>
              <select id="filter-repo" aria-label="Filter by repository" data-tip="Repository"></select>
              <select id="filter-assignee" aria-label="Filter by assignee" data-tip="Assignee"></select>
              <span class="date-range" data-tip="Only tickets due inside this range">
                Due
                <input type="date" id="filter-from" aria-label="Due from" />
                <span>→</span>
                <input type="date" id="filter-to" aria-label="Due until" />
              </span>
              <button id="filter-clear" data-tip="Clear all filters" hidden>Clear</button>
              <span id="filter-count" class="meta"></span>
            </div>
            <div id="tiles">
              <div class="tile"><div class="tile-num" id="stat-commits">–</div><div class="tile-label">Total commits</div></div>
              <div class="tile"><div class="tile-num" id="stat-open">0</div><div class="tile-label">Open tickets</div></div>
              <div class="tile"><div class="tile-num warn" id="stat-due">0</div><div class="tile-label">Due in 24h</div></div>
              <div class="tile"><div class="tile-num danger" id="stat-overdue">0</div><div class="tile-label">Overdue</div></div>
            </div>
            <h2 class="section-head">Coming up</h2>
            <div id="upcoming"></div>
            <details id="completed"><summary>Completed</summary><div id="done-list"></div></details>
          </section>

          <section id="tab-cal" class="tab-panel" hidden>
            <div class="cal-toolbar">
              <button id="cal-prev" aria-label="Previous month">‹</button>
              <span id="cal-title"></span>
              <button id="cal-next" aria-label="Next month">›</button>
              <button id="cal-today">Today</button>
              <span class="spacer"></span>
              <span id="cal-legend"></span>
            </div>
            <div id="cal-grid"></div>
          </section>

          <section id="tab-changes" class="tab-panel" hidden>
            <ul id="changes-list"></ul>
            <div id="commit-box">
              <input id="commit-msg" placeholder="Commit message" />
              <button id="commit-btn" data-icon="commit" data-tip="Stage everything and commit">Commit all</button>
            </div>
          </section>

          <section id="tab-history" class="tab-panel" hidden>
            <ul id="history-list"></ul>
          </section>

          <section id="tab-prs" class="tab-panel" hidden>
            <ul id="pr-list"></ul>
          </section>

          <section id="tab-notes" class="tab-panel" hidden>
            <div class="board-toolbar">
              <button id="new-note-btn" data-icon="plus" data-tip="Add a note to this repository">New note</button>
            </div>
            <div id="notes-list"></div>
          </section>
        </main>
      </div>
    </div>

    <dialog id="ticket-dialog">
      <form method="dialog" id="ticket-form">
        <h2 id="ticket-dialog-title">New ticket</h2>
        <label id="repo-field">Repository <select name="repo"></select></label>
        <label>Title <input name="title" required maxlength="120" /></label>
        <span class="editor-label">Description</span>
        <div id="ticket-editor"></div>
        <div class="row">
          <label>Deadline date <input name="date" type="date" /></label>
          <label>Time <input name="time" type="time" /></label>
        </div>
        <div class="dialog-actions">
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="ok" id="ticket-save">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="comments-dialog">
      <h2 id="comments-title"></h2>
      <div id="comments-list"></div>
      <div id="comment-editor"></div>
      <div class="dialog-actions">
        <form method="dialog"><button>Close</button></form>
        <button id="comment-send" data-icon="comment" data-tip="Post to GitHub (⌘↵)">Comment</button>
      </div>
    </dialog>

    <div id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
